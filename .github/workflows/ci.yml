name: ArtsFlow OS — Release Validation CI

on:
  push:
    branches: [ main, develop/v1.1 ]
  pull_request:
    branches: [ main, develop/v1.1 ]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Static Typecheck
        run: npm run typecheck

      - name: ESLint Code Quality
        run: npm run lint

      - name: Automated Test Suites
        run: npm test

      - name: Firebase Security Rules Tests
        run: npm run test:rules

      - name: Production Bundle Compilation
        env:
          VITE_BUILD_DATE: ${{ github.event.repository.updated_at }}
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: npm run build
