name: Deploy ArtsFlow OS to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Validate and deploy production
    runs-on: ubuntu-latest
    environment: production
    if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARTFLOW_OS != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARTFLOW_OS }}
        run: |
          credentials_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials_file"
          chmod 600 "$credentials_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"

      - name: Validate release
        env:
          VITE_BUILD_DATE: ${{ github.event.repository.updated_at }}
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: npm run validate

      - name: Deploy explicit Firebase project
        run: npm run deploy:firebase
